name: sync-songs-bank

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "max new songs this run (0 = all)"
        default: "0"
        required: false
      budget_min:
        description: "stop fetching after this many minutes (rest on the next run)"
        default: "300"
        required: false

concurrency:
  group: riyio-sync-songs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install "librosa==0.11.0" "numpy==2.4.6"
      - name: Sync songs
        env:
          YT_RAPIDAPI_KEY_1: ${{ secrets.YT_RAPIDAPI_KEY_1 }}
          YT_RAPIDAPI_KEY_2: ${{ secrets.YT_RAPIDAPI_KEY_2 }}
          YT_RAPIDAPI_KEY_3: ${{ secrets.YT_RAPIDAPI_KEY_3 }}
          YT_RAPIDAPI_KEY_4: ${{ secrets.YT_RAPIDAPI_KEY_4 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SYNC_LIMIT: ${{ inputs.limit || '0' }}
          SYNC_BUDGET_MIN: ${{ inputs.budget_min || '300' }}
        run: python -u scripts/sync_songs_bank.py
      - name: Save song tags (BPM) for the new songs
        if: always()
        run: |
          git add config/song_tags.json config/songs_catalog.json config/songs_refetch.json
          if ! git diff --cached --quiet; then
            git -c user.name=bibi-bot -c user.email=bot@users.noreply.github.com commit -m "chore: songs-bank sync ${{ github.run_number }} song tags"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && break
              echo "push retry $i failed, waiting"
              sleep 10
            done
          fi
