name: sync-songs-bank

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "max new songs this run (0 = all)"
        default: "0"
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sync songs
        env:
          YT_RAPIDAPI_KEY_1: ${{ secrets.YT_RAPIDAPI_KEY_1 }}
          YT_RAPIDAPI_KEY_2: ${{ secrets.YT_RAPIDAPI_KEY_2 }}
          YT_RAPIDAPI_KEY_3: ${{ secrets.YT_RAPIDAPI_KEY_3 }}
          YT_RAPIDAPI_KEY_4: ${{ secrets.YT_RAPIDAPI_KEY_4 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SYNC_LIMIT: ${{ inputs.limit || '0' }}
        run: python scripts/sync_songs_bank.py
