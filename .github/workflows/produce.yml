name: produce-videos

on:
  schedule:
    # Exact 7x daily UTC crons for peak India + US IST slots
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "30 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "classic | build_drop"
        default: "classic"
        required: false
      count:
        description: "videos to produce"
        default: "1"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download sleek Google Fonts into fonts/
        run: |
          mkdir -p fonts
          # Dynamic fetch via Google Fonts CSS API (non-woff2 User-Agent forces .ttf)
          CSS=$(curl -fsSL -A "Mozilla/5.0" \
            "https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Playfair+Display:ital,wght@0,600;1,600&family=Montserrat:wght@300;500&family=Roboto+Condensed:wght@400;700")
          echo "$CSS" | grep -oE 'https://fonts.gstatic.com/[^)]+\.ttf' | sort -u > /tmp/font_urls.txt
          i=0
          while read -r url; do
            i=$((i+1))
            # Map roughly to expected names; fallback numbered
            case $i in
              1) name="Cinzel-Regular.ttf" ;;
              2) name="CormorantGaramond-Regular.ttf" ;;
              3) name="PlayfairDisplay-Italic.ttf" ;;
              4) name="Montserrat-Light.ttf" ;;
              5) name="Montserrat-Medium.ttf" ;;
              6) name="RobotoCondensed-Regular.ttf" ;;
              *) name="font_$i.ttf" ;;
            esac
            curl -fsSL -o "fonts/$name" "$url" && echo "saved $name" || echo "fail $url"
          done < /tmp/font_urls.txt
          ls -la fonts/ || true

      - name: Ensure queue
        run: |
          python -c "from pipeline_lib.queue_manager import ensure_queue; ensure_queue()"

      - name: Produce videos + publish via Buffer
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ensure rolling media-cache release exists
          gh release view media-cache --repo "$REPO" >/dev/null 2>&1 || \
            gh release create media-cache --repo "$REPO" --title "RIYIO media cache" --notes "Rolling public media for Buffer" || true

          # Minimal valid test renders if real clips not present (so Buffer can be verified)
          # In full production this is replaced by vicestyle.py dual render
          if [ ! -f out.wide.mp4 ]; then
            ffmpeg -y -f lavfi -i color=c=black:s=1280x720:d=3 -f lavfi -i sine=frequency=440:duration=3 \
              -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest out.wide.mp4
          fi
          if [ ! -f out.shorts.mp4 ]; then
            ffmpeg -y -f lavfi -i color=c=black:s=720x1280:d=3 -f lavfi -i sine=frequency=440:duration=3 \
              -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest out.shorts.mp4
          fi

          # Unique names so release overwrites cleanly
          TS=$(date +%s)
          cp out.wide.mp4 "wide_${TS}.mp4"
          cp out.shorts.mp4 "shorts_${TS}.mp4"

          gh release upload media-cache "wide_${TS}.mp4" "shorts_${TS}.mp4" \
            --repo "$REPO" --clobber

          WIDE_URL="https://github.com/${REPO}/releases/download/media-cache/wide_${TS}.mp4"
          SHORTS_URL="https://github.com/${REPO}/releases/download/media-cache/shorts_${TS}.mp4"
          echo "WIDE_URL=$WIDE_URL"
          echo "SHORTS_URL=$SHORTS_URL"
          export WIDE_URL SHORTS_URL

          python - << 'PY'
          import os
          from pipeline_lib.queue_manager import next_ready, mark_done, ensure_queue
          from pipeline_lib.uploader import publish_via_buffer
          ensure_queue()
          item = next_ready() or {"id": "test", "topic": "RIYIO test edit"}
          print("processing", item.get("id"), item.get("topic"))
          wide_url = os.environ.get("WIDE_URL")
          shorts_url = os.environ.get("SHORTS_URL")
          result = publish_via_buffer(wide_url, shorts_url,
                                      item.get("topic") or "RIYIO edit",
                                      item.get("topic") or "RIYIO edit")
          print("Buffer result:", result)
          if item.get("id") != "test":
              mark_done(item["id"])
          PY

      - name: Upload rendered videos as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riyio-renders-${{ github.run_id }}
          path: |
            *.mp4
            *.json
            inbox/queue.json
            history.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated history + queue
        if: always()
        run: |
          git config user.name "riyio-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add history.json inbox/queue.json || true
          git diff --cached --quiet || git commit -m "pipeline: update history + queue after run ${{ github.run_id }}"
          git push || true
