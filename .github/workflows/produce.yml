name: produce-videos

# Daily scheduled slots moved to riyio-v2.yml (run_v2.py, production publish).
# This workflow is left in place for manual legacy runs of run_real.py only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "classic | build_drop"
        default: "classic"
        required: false
      count:
        description: "videos to produce"
        default: "1"
        required: false
      demo_only:
        description: "Render real video + upload to media-cache, but skip Buffer posting"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install system deps + deno (yt-dlp JS runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl unzip
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export PATH="$HOME/.deno/bin:$PATH"
          deno --version || true

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download sleek Google Fonts into fonts/
        run: |
          mkdir -p fonts
          CSS=$(curl -fsSL -A "Mozilla/5.0" \
            "https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Playfair+Display:ital,wght@0,600;1,600&family=Montserrat:wght@300;500&family=Roboto+Condensed:wght@400;700")
          echo "$CSS" | grep -oE 'https://fonts.gstatic.com/[^)]+\.ttf' | sort -u > /tmp/font_urls.txt
          i=0
          while read -r url; do
            i=$((i+1))
            case $i in
              1) name="Cinzel-Regular.ttf" ;;
              2) name="CormorantGaramond-Regular.ttf" ;;
              3) name="PlayfairDisplay-Italic.ttf" ;;
              4) name="Montserrat-Light.ttf" ;;
              5) name="Montserrat-Medium.ttf" ;;
              6) name="RobotoCondensed-Regular.ttf" ;;
              *) name="font_$i.ttf" ;;
            esac
            curl -fsSL -o "fonts/$name" "$url" && echo "saved $name" || echo "fail $url"
          done < /tmp/font_urls.txt
          ls -la fonts/ || true

      - name: Ensure queue
        run: |
          python -c "from pipeline_lib.queue_manager import ensure_queue; ensure_queue()"

      - name: Produce real video + optional Buffer
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_RAPIDAPI_KEY_1: ${{ secrets.YT_RAPIDAPI_KEY_1 }}
          YT_RAPIDAPI_KEY_2: ${{ secrets.YT_RAPIDAPI_KEY_2 }}
          YT_RAPIDAPI_KEY_3: ${{ secrets.YT_RAPIDAPI_KEY_3 }}
          YT_RAPIDAPI_KEY_4: ${{ secrets.YT_RAPIDAPI_KEY_4 }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEMO_ONLY: ${{ inputs.demo_only || 'false' }}
        run: |
          set -euo pipefail
          python run_real.py

          SRC=$(ls -1 out.shorts.mp4 out.wide.mp4 2>/dev/null | head -1 || true)
          if [ -z "$SRC" ]; then
            echo "No rendered video found"
            exit 1
          fi

          gh release view media-cache --repo "$REPO" >/dev/null 2>&1 || \
            gh release create media-cache --repo "$REPO" --title "RIYIO media cache" --notes "Rolling public media for Buffer" || true

          TS=$(date +%s)
          OUT="shorts_${TS}.mp4"
          cp "$SRC" "$OUT"
          gh release upload media-cache "$OUT" --repo "$REPO" --clobber

          SHORTS_URL="https://github.com/${REPO}/releases/download/media-cache/${OUT}"
          echo "SHORTS_URL=$SHORTS_URL"
          export SHORTS_URL

          if [ -f meta.json ]; then
            echo "==== GENERATED META ===="
            cat meta.json
          fi

          python - << 'PY'
          import os, json
          from pipeline_lib.uploader import publish_via_buffer
          demo = os.environ.get("DEMO_ONLY", "false").lower() in ("1", "true", "yes")
          shorts_url = os.environ.get("SHORTS_URL")
          meta = {}
          if os.path.exists("meta.json"):
              meta = json.load(open("meta.json"))
          title = meta.get("title_youtube") or meta.get("hook") or "RIYIO Edit"
          caption = meta.get("caption_x") or meta.get("hook") or title
          print("DEMO_ONLY =", demo)
          result = publish_via_buffer(shorts_url, title, caption, demo_only=demo)
          print("Buffer result:", result)
          PY

      - name: Upload rendered videos as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riyio-renders-${{ github.run_id }}
          path: |
            *.mp4
            *.json
            inbox/queue.json
            history.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated history + queue
        if: always()
        run: |
          git config user.name "riyio-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add history.json inbox/queue.json || true
          git diff --cached --quiet || git commit -m "pipeline: update history + queue after run ${{ github.run_id }}"
          git push || true
