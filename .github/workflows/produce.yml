name: produce-videos

on:
  schedule:
    # Exact 7x daily UTC crons for peak India + US IST slots
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "30 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "classic | build_drop"
        default: "classic"
        required: false
      count:
        description: "videos to produce"
        default: "1"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download sleek Google Fonts into fonts/
        run: |
          mkdir -p fonts
          # Cinzel
          curl -fsSL -o fonts/Cinzel-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf" || true
          # Cormorant Garamond
          curl -fsSL -o fonts/CormorantGaramond-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/cormorantgaramond/CormorantGaramond-Regular.ttf" || true
          # Playfair Display Italic
          curl -fsSL -o fonts/PlayfairDisplay-Italic.ttf "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay-Italic.ttf" || true
          # Montserrat Light / Medium
          curl -fsSL -o fonts/Montserrat-Light.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat-Light.ttf" || true
          curl -fsSL -o fonts/Montserrat-Medium.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat-Medium.ttf" || true
          # Roboto Condensed
          curl -fsSL -o fonts/RobotoCondensed-Regular.ttf "https://github.com/google/fonts/raw/main/apache/robotocondensed/RobotoCondensed-Regular.ttf" || true
          ls -la fonts/ || true

      - name: Ensure queue
        run: |
          python -c "from pipeline_lib.queue_manager import ensure_queue; ensure_queue()"

      - name: Produce videos
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          WIDE_URL: ${{ secrets.WIDE_URL }}
          SHORTS_URL: ${{ secrets.SHORTS_URL }}
          # Groq primary AI (rotation)
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional fallbacks
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - << 'PY'
          from pipeline_lib.queue_manager import next_ready, mark_done, ensure_queue
          from pipeline_lib.qc import qc_video
          from pipeline_lib.uploader import publish_via_buffer
          from pathlib import Path
          import os, sys
          ensure_queue()
          item = next_ready()
          if not item:
              print("no pending item")
              sys.exit(0)
          print("processing", item["id"], item["topic"])
          # Real production would render here and host the mp4s at public URLs.
          # For now we publish if public URLs are provided via secrets, else skip gracefully.
          wide_url = os.environ.get("WIDE_URL") or None
          shorts_url = os.environ.get("SHORTS_URL") or None
          title = item.get("topic") or "RIYIO edit"
          result = publish_via_buffer(wide_url, shorts_url, title, title)
          print("Buffer result:", result)
          mark_done(item["id"])
          PY

      - name: Upload rendered videos as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riyio-renders-${{ github.run_id }}
          path: |
            *.mp4
            *.json
            inbox/queue.json
            history.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated history + queue
        if: always()
        run: |
          git config user.name "riyio-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add history.json inbox/queue.json || true
          git diff --cached --quiet || git commit -m "pipeline: update history + queue after run ${{ github.run_id }}"
          git push || true
