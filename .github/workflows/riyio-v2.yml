name: riyio-v2
on:
  workflow_dispatch:
    inputs:
      demo_only:
        type: boolean
        default: true
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium
      - name: Python deps
        run: pip install google-genai librosa faster-whisper requests
      - name: Remotion deps
        working-directory: remotion
        run: npm install
      - name: Run pipeline
        env:
          DEMO_ONLY: ${{ inputs.demo_only }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
          RAPIDAPI_KEY_2: ${{ secrets.RAPIDAPI_KEY_2 }}
          RAPIDAPI_KEY_3: ${{ secrets.RAPIDAPI_KEY_3 }}
          RAPIDAPI_KEY_4: ${{ secrets.RAPIDAPI_KEY_4 }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python run_v2.py || true
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyio-final
          path: |
            out.final.mp4
            out_base.mp4
            remotion/out/*.mp4
          if-no-files-found: ignore
