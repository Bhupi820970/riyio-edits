name: riyio-v2
on:
  workflow_dispatch:
    inputs:
      demo_only:
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * *"
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-genai librosa faster-whisper requests
      - name: Run
        env:
          DEMO_ONLY: ${{ inputs.demo_only || 'true' }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          RAPIDAPI_KEY_1: ${{ secrets.RAPIDAPI_KEY_1 }}
        run: python run_v2.py || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: riyio-v2-out
          path: "*.mp4"
          if-no-files-found: ignore
